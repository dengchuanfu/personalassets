<!doctype html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <title th:text="${site.title + '-' + title}"></title>
    <link data-n-head="true" rel="icon" type="image/x-icon" th:href="${site.favicon}">
    <th:block th:replace="~{plugin:personalassets:modules/style}"></th:block>
    <style>
        .personalassets-body {
            background: #fff;
            margin: 0;
        }

        .personalassets-header {
            background: #fff;
            border-bottom: 1px solid rgba(0, 0, 0, .08);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .personalassets-nav {
            align-items: center;
            display: flex;
            gap: 28px;
            height: 56px;
            margin: 0 auto;
            max-width: 1480px;
            padding: 0 24px;
        }

        .personalassets-brand {
            align-items: center;
            color: inherit;
            display: inline-flex;
            flex: 0 0 auto;
            text-decoration: none;
        }

        .personalassets-logo {
            display: block;
            height: 40px;
            object-fit: cover;
            width: 40px;
        }

        .personalassets-menu {
            align-items: center;
            display: flex;
            flex: 1 1 auto;
            gap: 30px;
            list-style: none;
            margin: 0;
            min-width: 0;
            padding: 0;
        }

        .personalassets-menu li {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .personalassets-menu a {
            color: inherit;
            display: inline-flex;
            font-size: 14px;
            line-height: 56px;
            text-decoration: none;
            white-space: nowrap;
        }
    </style>
</head>
<body class="personalassets-body">
<header class="personalassets-header" th:with="menu=${menuFinder.getPrimary()}">
    <nav class="personalassets-nav">
        <a class="personalassets-brand" th:href="@{/}">
            <img class="personalassets-logo" th:if="${not #strings.isEmpty(site.logo)}" th:src="${site.logo}" th:alt="${site.title}">
            <span class="personalassets-site-title" th:if="${#strings.isEmpty(site.logo)}" th:text="${site.title}"></span>
        </a>
        <ul class="personalassets-menu" th:if="${menu != null and not #lists.isEmpty(menu.menuItems)}">
            <li th:each="menuItem : ${menu.menuItems}">
                <a th:href="@{${menuItem.status.href}}"
                   th:text="${menuItem.status.displayName}"
                   th:target="${menuItem.spec.target?.value}"></a>
            </li>
        </ul>
    </nav>
</header>

<section class="personalassets-hero">
    <div class="personalassets-hero-inner">
        <h1 th:text="${title}"></h1>
        <span class="personalassets-hero-line"></span>
        <p th:text="${subtitle}"></p>
    </div>
</section>

<main class="personalassets-page personalassets-layout">
    <th:block th:replace="~{plugin:personalassets:modules/personalassets-list}"></th:block>
</main>
</body>
</html>
