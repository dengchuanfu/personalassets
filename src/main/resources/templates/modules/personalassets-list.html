<div id="personalassets">
    <div class="personalassets-toolbar">
        <form class="personalassets-filter-form" method="get" th:action="@{/personalassets}">
            <label class="personalassets-filter">
                <svg class="personalassets-filter-icon"
                     viewBox="0 0 32 32"
                     aria-hidden="true"
                     focusable="false">
                    <path fill="currentColor"
                          d="M27 16h-2v2h-1c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h4v2h-6v2h3v2h2v-2h1c1.1 0 2-.9 2-2v-2c0-1.1-.9-2-2-2h-4v-2h6v-2h-3zm1-8h-6V4c0-1.1-.9-2-2-2h-8c-1.1 0-2 .9-2 2v4H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h15v-2H4V10h24v4h2v-4c0-1.1-.9-2-2-2m-8 0h-8V4h8z"></path>
                </svg>
                <select class="personalassets-filter-select" name="group" aria-label="Asset group filter">
                    <option value="" th:selected="${#strings.isEmpty(currentGroup)}">&#20840;&#37096;&#20998;&#32452;</option>
                    <option th:each="group : ${personalassets.groupBy()}"
                            th:value="${group.metadata.name}"
                            th:selected="${group.metadata.name == currentGroup}"
                            th:text="${group.spec.displayName}"></option>
                </select>
            </label>
            <button class="personalassets-filter-submit" type="submit">&#31579;&#36873;</button>
        </form>

        <label class="personalassets-search">
            <svg class="personalassets-search-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true"
                 focusable="false">
                <path fill="currentColor"
                      d="M9.5 3a6.5 6.5 0 0 1 5.2 10.4l4.45 4.45l-1.3 1.3l-4.45-4.45A6.5 6.5 0 1 1 9.5 3m0 1.8a4.7 4.7 0 1 0 0 9.4a4.7 4.7 0 0 0 0-9.4"></path>
            </svg>
            <input class="personalassets-search-input"
                   type="search"
                   autocomplete="off"
                   placeholder="&#25628;&#32034;&#36164;&#20135;">
        </label>
    </div>

    <th:block th:each="group : ${personalassets.groupBy()}">
        <section class="personalassets-item"
                 th:if="${#strings.isEmpty(currentGroup) or group.metadata.name == currentGroup}"
                 th:attr="data-personalassets-group=${group.metadata.name}">
            <div class="personalassets-group-heading">
                <div class="personalassets-group-title">
                    <svg class="personalassets-item-icon"
                         viewBox="0 0 32 32"
                         aria-hidden="true"
                         focusable="false">
                        <path fill="currentColor"
                              d="M27 16h-2v2h-1c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h4v2h-6v2h3v2h2v-2h1c1.1 0 2-.9 2-2v-2c0-1.1-.9-2-2-2h-4v-2h6v-2h-3zm1-8h-6V4c0-1.1-.9-2-2-2h-8c-1.1 0-2 .9-2 2v4H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h15v-2H4V10h24v4h2v-4c0-1.1-.9-2-2-2m-8 0h-8V4h8z"></path>
                    </svg>
                    <h2 class="personalassets-item-title" th:text="${group.spec.displayName}"></h2>
                    <span class="personalassets-item-count">
                        <span>&#65288;</span><span class="personalassets-item-count-value"
                                                  th:text="${#lists.size(group.personalAssets)}"
                                                  th:attr="data-personalassets-total=${#lists.size(group.personalAssets)}"></span><span>&#65289;</span>
                    </span>
                </div>
            </div>

            <div class="personalassets-item-description"
                 th:if="${not #strings.isEmpty(group.spec.description)}"
                 th:text="${group.spec.description}"></div>

            <div class="personalassets-item-content">
                <article th:each="personalAsset : ${group.personalAssets}"
                         class="personalassets-item-content-item"
                         th:attr="data-personalassets-search=${#strings.toLowerCase(personalAsset.spec.displayName + ' ' + personalAsset.assetId + ' ' + personalAsset.metadata.name)}">
                    <div class="personalassets-item-content-item-cover">
                        <img class="personalassets-item-content-item-image entered"
                             th:alt="${personalAsset.spec.displayName}"
                             th:src="${personalAsset.spec.cover}">
                    </div>

                    <div class="personalassets-item-content-item-info">
                        <h3 class="personalassets-item-content-item-name" th:text="${personalAsset.spec.displayName}"></h3>
                        <div class="personalassets-item-content-item-specification"
                             th:if="${not #strings.isEmpty(personalAsset.spec.specification)}"
                             th:text="${personalAsset.spec.specification}"></div>
                    </div>

                    <div class="personalassets-item-content-item-body">
                        <div class="personalassets-item-content-item-description"
                             th:if="${not #strings.isEmpty(personalAsset.spec.description)}"
                             th:text="${personalAsset.spec.description}"></div>
                    </div>

                    <div class="personalassets-item-content-item-footer">
                        <span class="personalassets-item-content-item-price"
                              th:if="${showPrice and not #strings.isEmpty(personalAsset.spec.url)}">
                            <svg class="personalassets-item-content-item-price-icon"
                                 viewBox="0 0 24 24"
                                 aria-hidden="true"
                                 focusable="false">
                                <path fill="currentColor"
                                      d="M6.5 15v-1.5H4v-2h5V9H6q-.825 0-1.413-.588T4 7V5q0-.825.588-1.413T6 3h.5V1.5h2V3H11v2H6v2.5h3q.825 0 1.413.588T11 9.5V12q0 .825-.588 1.413T9 14h-.5v1zm7.45 5.6l-3.55-3.55l1.4-1.4l2.15 2.15l5.25-5.25l1.4 1.4z"></path>
                            </svg>
                            <span th:text="${personalAsset.spec.url}"></span>
                        </span>
                        <span class="personalassets-item-content-item-id"
                              th:text="${'ID. ' + personalAsset.assetId}"></span>
                    </div>
                </article>
            </div>
        </section>
    </th:block>

    <script>
        (() => {
            const initPersonalAssets = () => {
                const root = document.getElementById("personalassets");
                const input = root?.querySelector(".personalassets-search-input");
                const select = root?.querySelector(".personalassets-filter-select");
                const form = root?.querySelector(".personalassets-filter-form");

                if (!root || !input || !select || root.dataset.personalassetsReady === "true") {
                    return;
                }

                root.dataset.personalassetsReady = "true";

                const groups = [...root.querySelectorAll(".personalassets-item")];
                const cards = [...root.querySelectorAll(".personalassets-item-content-item")];
                const normalize = (value) => (value || "")
                    .toString()
                    .toLowerCase()
                    .normalize("NFKD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/[\s\-_.#/\\]+/g, "");

                const matchesCard = (card, keyword) => {
                    if (!keyword) {
                        return true;
                    }

                    const text = card.dataset.personalassetsSearch || "";
                    const normalizedText = normalize(text);
                    return keyword.split(/\s+/)
                        .filter(Boolean)
                        .every((word) => {
                            const normalizedWord = normalize(word);
                            return text.includes(word.toLowerCase())
                                || normalizedText.includes(normalizedWord);
                        });
                };

                const filterAssets = () => {
                    const keyword = input.value.trim();

                    cards.forEach((card) => {
                        card.classList.toggle("personalassets-is-hidden", !matchesCard(card, keyword));
                    });

                    groups.forEach((group) => {
                        const visibleCards = group.querySelectorAll(".personalassets-item-content-item:not(.personalassets-is-hidden)");
                        const count = group.querySelector(".personalassets-item-count-value");
                        if (count) {
                            count.textContent = keyword === ""
                                ? count.dataset.personalassetsTotal || String(visibleCards.length)
                                : String(visibleCards.length);
                        }
                        group.classList.toggle("personalassets-is-hidden", keyword !== "" && visibleCards.length === 0);
                    });
                };

                input.addEventListener("input", filterAssets);
                input.addEventListener("search", filterAssets);
                select.addEventListener("change", () => form?.requestSubmit());
                filterAssets();
            };

            initPersonalAssets();
            document.addEventListener("DOMContentLoaded", initPersonalAssets);
            window.addEventListener("pageshow", initPersonalAssets);
        })();
    </script>
</div>
