<!doctype html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <title th:text="${site.title + '-' + title}"></title>
    <link data-n-head="true" rel="icon" type="image/x-icon" th:href="${site.favicon}">
    <th:block th:replace="~{plugin:personalassets:modules/style}"></th:block>
</head>
<body class="personalassets-body">
<header class="personalassets-header" th:with="menu=${menuFinder.getPrimary()}">
    <nav class="personalassets-nav">
        <a class="personalassets-brand" th:href="@{/}">
            <img class="personalassets-logo" th:if="${not #strings.isEmpty(site.logo)}" th:src="${site.logo}" th:alt="${site.title}">
            <span class="personalassets-site-title" th:if="${#strings.isEmpty(site.logo)}" th:text="${site.title}"></span>
        </a>
        <ul class="personalassets-menu" th:if="${menu != null and not #lists.isEmpty(menu.menuItems)}">
            <li th:each="menuItem : ${menu.menuItems}">
                <a th:href="@{${menuItem.status.href}}"
                   th:text="${menuItem.status.displayName}"
                   th:target="${menuItem.spec.target?.value}"></a>
            </li>
        </ul>
    </nav>
</header>

<section class="personalassets-hero">
    <div class="personalassets-hero-inner">
        <h1 th:text="${title}"></h1>
        <span class="personalassets-hero-line"></span>
        <p>工欲善其事，必先利其器</p>
    </div>
</section>

<main class="personalassets-page personalassets-layout">
    <th:block th:replace="~{plugin:personalassets:modules/equipment}"></th:block>
</main>
</body>
</html>
