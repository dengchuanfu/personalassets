apiVersion: v1alpha1
kind: Setting
metadata:
  name: personalassets-settings
spec:
  forms:
    - group: base
      label: 基本设置
      formSchema:
        - $formkit: text
          label: 页面标题
          name: title
          validation: required
          value: "资产"
        - $formkit: text
          label: 页面副标题
          name: subtitle
          value: "工欲善其事，必先利其器"
        - $formkit: text
          label: 资产 ID 前缀
          name: assetIdPrefix
          value: ""
        - $formkit: number
          label: 资产 ID 长度
          name: assetIdLength
          validation: required|min:2|max:32
          value: 6
        - $formkit: text
          label: 资产列表显示条数
          name: pageSize
          validation: required|Number
          value: 20
